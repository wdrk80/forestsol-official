  <link rel="canonical" href="https://forestsol.jp/thumbnails.html">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background:
        linear-gradient(rgba(5, 5, 8, 0.20), rgba(5, 5, 8, 0.78)),
        url("images/backgrounds/thumbnails-bg.png");
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
      color: #f2f2f2;
    }

    header {
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    .header-image {
      width: 100%;
      height: auto;
      display: block;
      max-height: 430px;
      object-fit: cover;
      opacity: 0.94;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      text-align: center;
      padding: 16px;
      background: rgba(5, 5, 8, 0.94);
      border-bottom: 1px solid rgba(255, 45, 45, 0.35);
      backdrop-filter: blur(4px);
    }

    nav a {
      color: #fff;
      margin: 0 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    nav a:hover {
      color: #ff5a5a;
    }

    section {
      max-width: 1150px;
      margin: auto;
      padding: 46px 18px;
      min-height: 380px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .item {
      background: rgba(12, 12, 16, 0.76);
      border: 1px solid rgba(255, 60, 60, 0.34);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .item:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 90, 90, 0.7);
    }

    .item img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 12px;
      background: #000;
      display: block;
      cursor: pointer;
    }

    .item p {
      text-align: center;
      color: #f3f3f3;
      font-weight: bold;
      line-height: 1.5;
      margin: 12px 0 4px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .status {
      text-align: center;
      color: #f3f3f3;
      padding: 30px 18px;
      line-height: 1.8;
      background: rgba(12, 12, 16, 0.76);
      border: 1px solid rgba(255, 60, 60, 0.34);
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      grid-column: 1 / -1;
    }

    .pagination {
      display: none;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }

    .pagination.visible {
      display: flex;
    }

    .pagination button {
      min-width: 42px;
      min-height: 42px;
      padding: 8px 13px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 10px;
      background: rgba(5, 5, 12, 0.82);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .pagination button:hover:not(:disabled),
    .pagination button.active {
      border-color: rgba(255, 255, 255, 0.82);
      background: rgba(105, 80, 175, 0.86);
    }

    .pagination button:disabled {
      cursor: default;
      opacity: 0.42;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      background: rgba(3, 3, 5, 0.96);
      color: #ccc;
      font-size: 13px;
      line-height: 1.7;
    }

    .image-modal {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      justify-content: center;
      align-items: center;
      padding: 14px;
    }

    .image-modal img {
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 12px;
    }

    @media (max-width: 768px) {
      body {
        background-attachment: scroll;
      }

      nav {
        padding: 12px 6px;
      }

      nav a {
        display: inline-block;
        margin: 5px 8px;
        font-size: 13px;
      }

      .header-image {
        max-height: none;
      }

      section {
        padding: 28px 8px;
      }

      .gallery {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      .item {
        padding: 5px;
        border-radius: 10px;
      }

      .item:hover {
        transform: none;
      }

      .item img {
        border-radius: 8px;
      }

      .item p {
        font-size: 11px;
        margin: 6px 0 2px;
        line-height: 1.3;
      }
    }
  </style>

<body>

<header>
  <img class="header-image" src="images/logos/thumbnails-header.png" alt="Thumbnail Gallery">
</header>

<nav>
  <a href="index.html">メンバー紹介</a>
  <a href="forestfarm.html">ForestFarm</a>
  <a href="thumbnails.html">サムネ置き場</a>
  <a href="illustrations.html">イラスト</a>
  <a href="terms.html">利用規約</a>
</nav>

<section>
  <div id="gallery" class="gallery">
    <div class="status">サムネイルを読み込み中...</div>
  </div>
  <div id="pagination" class="pagination" aria-label="ギャラリーのページ切り替え"></div>
</section>

<footer>
  © Forestsol / ウォルフィ<br>
  Unauthorized use prohibited.
</footer>

<div id="imageModal" class="image-modal" onclick="closeImage()">
  <img id="modalImage" src="" alt="拡大画像">
</div>

<script>
  const gallery = document.getElementById("gallery");

  const pagination = document.getElementById("pagination");
  const ITEMS_PER_PAGE = 30;
  const DEFAULT_TITLE = "サムネイル";
  let galleryItems = [];

  function getRequestedPage() {
    const page = Number.parseInt(new URLSearchParams(window.location.search).get("page"), 10);
    return Number.isInteger(page) && page > 0 ? page : 1;
  }

  function updatePageUrl(page) {
    const url = new URL(window.location.href);

    if (page === 1) {
      url.searchParams.delete("page");
    } else {
      url.searchParams.set("page", String(page));
    }

    window.history.replaceState(null, "", url);
  }

  function createCard(item) {
    const title = item.title || DEFAULT_TITLE;
    const image = item.image || "";
    const card = document.createElement("div");

    card.className = "item";
    card.innerHTML =
      '<img src="' + escapeHtml(image) + '" alt="' + escapeHtml(title) + '" onclick="openImage(this.src)">' +
      '<p>' + escapeHtml(title) + '</p>';

    return card;
  }

  function addPageButton(label, page, currentPage, disabled) {
    const button = document.createElement("button");

    button.type = "button";
    button.textContent = label;
    button.disabled = disabled;

    if (page === currentPage && !disabled) {
      button.classList.add("active");
      button.setAttribute("aria-current", "page");
    }

    button.addEventListener("click", function() {
      renderPage(page);
      document.querySelector("section").scrollIntoView({ behavior: "smooth", block: "start" });
    });

    pagination.appendChild(button);
  }

  function renderPagination(currentPage, pageCount) {
    pagination.innerHTML = "";
    pagination.classList.toggle("visible", pageCount > 1);

    if (pageCount <= 1) return;

    addPageButton("前へ", currentPage - 1, currentPage, currentPage === 1);

    for (let page = 1; page <= pageCount; page += 1) {
      addPageButton(String(page), page, currentPage, false);
    }

    addPageButton("次へ", currentPage + 1, currentPage, currentPage === pageCount);
  }

  function renderPage(page) {
    const pageCount = Math.ceil(galleryItems.length / ITEMS_PER_PAGE);
    const currentPage = Math.min(Math.max(page, 1), pageCount);
    const start = (currentPage - 1) * ITEMS_PER_PAGE;

    gallery.innerHTML = "";

    galleryItems
      .slice(start, start + ITEMS_PER_PAGE)
      .forEach(function(item) {
        gallery.appendChild(createCard(item));
      });

    renderPagination(currentPage, pageCount);
    updatePageUrl(currentPage);
  }

  function escapeHtml(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function openImage(src) {
    const modal = document.getElementById("imageModal");
    const modalImage = document.getElementById("modalImage");

    modalImage.src = src;
    modal.style.display = "flex";
  }

  function closeImage() {
    const modal = document.getElementById("imageModal");
    const modalImage = document.getElementById("modalImage");

    modal.style.display = "none";
    modalImage.src = "";
  }

  async function loadThumbnails() {
    try {
      const response = await fetch("data/thumbnails.json?time=" + Date.now());

      if (!response.ok) {
        gallery.innerHTML = '<div class="status">まだサムネイルがありません。管理ページからアップロードしてください。</div>';
        return;
      }

      const items = await response.json();

      if (!Array.isArray(items) || items.length === 0) {
        gallery.innerHTML = '<div class="status">まだサムネイルがありません。管理ページからアップロードしてください。</div>';
        return;
      }

      galleryItems = items.filter(function(item) {
        return item && item.image;
      });

      renderPage(getRequestedPage());

    } catch (error) {
      gallery.innerHTML = '<div class="status">サムネイルの読み込みに失敗しました。</div>';
    }
  }

  loadThumbnails();
</script>

</body>
</html>
