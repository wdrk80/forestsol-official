<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forest Craft Studio 作品一覧 | Forest Sol</title>
<meta name="description" content="Forest Craft Studioから公開された作品を20件ずつ閲覧できます。">
<script src="assets/page-transition.js" defer></script>
<style>
:root{--green:#78f0a1;--text:#f7fff9;--muted:#abc0b7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(rgba(1,12,8,.65),#020806),url("images/forestcraft/back-image.png") center/cover fixed no-repeat,#020806}
a{color:inherit}.gallery-page-head{padding:34px 20px 25px;border-bottom:1px solid rgba(112,225,170,.35);background:rgba(2,20,14,.91);backdrop-filter:blur(10px)}.gallery-page-head-inner{width:min(1180px,calc(100% - 10px));margin:auto}.back-link{display:inline-flex;text-decoration:none;color:#aee9cf;font-weight:800;font-size:13px;margin-bottom:12px}.gallery-page-head h1{margin:0 0 8px;font-size:clamp(29px,4vw,45px)}.gallery-page-head p{margin:0;color:var(--muted);line-height:1.7}
main{width:min(1180px,calc(100% - 24px));margin:auto;padding:28px 0 70px}.filters{display:grid;gap:14px;padding:20px;border:1px solid rgba(112,210,165,.35);border-radius:18px;background:rgba(4,27,19,.9);box-shadow:0 16px 45px rgba(0,0,0,.25)}.tabs{display:flex;flex-wrap:wrap;gap:8px}.tab{padding:8px 13px;border:1px solid rgba(118,210,170,.4);border-radius:999px;background:#071b13;color:#e7f3ed;font:inherit;font-size:12px;font-weight:850;cursor:pointer}.tab.active{color:#052015;background:linear-gradient(135deg,#c2f7d0,#6ee39a);border-color:var(--green)}.toolbar{display:grid;grid-template-columns:minmax(210px,1fr) auto;gap:10px}.toolbar input,.toolbar select{min-height:44px;border:1px solid rgba(112,205,162,.42);border-radius:10px;background:#06170f;color:#fff;padding:0 12px;font:inherit}.status{padding:14px 2px 8px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{overflow:hidden;border:1px solid rgba(112,201,162,.36);border-radius:17px;background:#06170f;cursor:pointer;transition:.16s}.card:hover{transform:translateY(-3px);border-color:var(--green);box-shadow:0 14px 30px rgba(0,0,0,.28)}.preview{position:relative;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;background:#081510}.preview img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}.placeholder{font-size:44px;color:#658879}.kind{position:absolute;left:9px;top:9px;padding:5px 8px;border-radius:999px;background:rgba(3,10,8,.88);border:1px solid rgba(159,231,198,.34);font-size:10px;font-weight:850}.body{padding:13px}.body h2{margin:0 0 6px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body p{margin:0;color:#94aca2;font-size:11px;line-height:1.6}.body .meta{margin-top:7px}.empty{grid-column:1/-1;padding:48px 18px;text-align:center;color:#9eb4aa;border:1px dashed rgba(118,196,164,.35);border-radius:16px;background:rgba(3,12,9,.52)}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:24px}.pager button{min-height:40px;padding:8px 14px;border:1px solid rgba(112,210,165,.4);border-radius:10px;background:#0b2118;color:#eaf7f0;font:inherit;font-weight:850;cursor:pointer}.pager button:disabled{opacity:.35;cursor:not-allowed}.page-label{min-width:90px;text-align:center;color:#bdd8cc;font-size:12px}
.modal{position:fixed;inset:0;z-index:1000;display:none;place-items:center;padding:18px;background:rgba(0,0,0,.78);backdrop-filter:blur(8px)}.modal.open{display:grid}.modal-card{width:min(1180px,100%);max-height:calc(100vh - 28px);overflow:auto;border-radius:22px;border:1px solid rgba(133,214,180,.5);background:#081712}.modal-head{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;padding:11px;background:rgba(8,23,18,.95)}.modal-close{width:42px;height:42px;border:1px solid rgba(123,202,169,.4);border-radius:10px;color:#fff;background:#10251d;cursor:pointer;font-size:20px}.modal-content{padding:0 25px 28px}.empty-state{padding:40px 18px;text-align:center;color:#9eb4aa}.eyebrow{color:#8cf5ad;letter-spacing:.15em;font-size:12px;font-weight:950}.post-author,.post-meta{color:#94aca2;font-size:11px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){body{background-attachment:scroll}.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.modal{padding:6px}.modal-content{padding:0 12px 18px}}
</style>
<link rel="stylesheet" href="assets/forestcraft-gallery-original.css?v=20260822-assets2">
</head>
<body>
<header class="gallery-page-head"><div class="gallery-page-head-inner"><a class="back-link" href="forestcraft.html#gallery">← Forest Craft Studioへ戻る</a><h1>作品一覧</h1><p>Forest Craft Studioから公開された作品を、1ページ20件ずつ表示します。</p></div></header>
<main>
<section class="filters">
<div class="tabs" id="tabs"><button class="tab active" data-category="">すべて</button><button class="tab" data-category="skin">Skin</button><button class="tab" data-category="item">Item</button><button class="tab" data-category="block">Block</button><button class="tab" data-category="model">3D Model</button></div>
<div class="toolbar"><input id="q" type="search" placeholder="タイトル・作者・タグを検索"><select id="sort"><option value="new">新着順</option><option value="download">ダウンロード順</option><option value="rating">評価順</option></select></div>
</section>
<div class="status" id="status">作品を読み込み中...</div>
<div class="grid" id="grid"></div>
<div class="pager"><button id="prev" type="button">← 前へ</button><span class="page-label" id="pageLabel"></span><button id="next" type="button">次へ →</button></div>
</main>
<div id="postModal" class="modal"><div class="modal-card"><div class="modal-head"><button id="modalClose" class="modal-close" type="button">×</button></div><div id="modalContent" class="modal-content"></div></div></div>
<script src="assets/forestcraft-gallery-ui.js?v=20260820-gallery2"></script>
<script>
(function(){
  const API="https://forest-craft-api.wdrk80.workers.dev",PER=20;
  const grid=document.getElementById("grid"),status=document.getElementById("status"),q=document.getElementById("q"),sort=document.getElementById("sort"),prev=document.getElementById("prev"),next=document.getElementById("next"),pageLabel=document.getElementById("pageLabel");
  let all=[],category="",page=1;
  const icon=c=>({skin:"🐺",item:"⚔️",block:"🧊",model:"🐉"})[c]||"🎨";
  const helper=()=>window.ForestCraftGallery;
  const tags=p=>helper().tags(p);
  function filtered(){const needle=q.value.trim().toLowerCase();let r=all.filter(p=>(!category||p.category===category)&&(!needle||[p.title,p.username,p.display_name,...tags(p)].join(" ").toLowerCase().includes(needle)));return r.sort((a,b)=>sort.value==="download"?Number(b.download_count||0)-Number(a.download_count||0):sort.value==="rating"?Number(b.rating_average||0)-Number(a.rating_average||0):new Date(b.created_at)-new Date(a.created_at))}
  function render(){const h=helper(),items=filtered(),pages=Math.max(1,Math.ceil(items.length/PER));page=Math.min(page,pages);const shown=items.slice((page-1)*PER,page*PER);grid.innerHTML="";if(!shown.length){grid.innerHTML='<div class="empty">公開作品はまだありません。</div>'}else shown.forEach(p=>{const a=document.createElement("article");a.className="card";const pv=p.preview_file_id?'<img src="'+API+'/files/'+encodeURIComponent(p.preview_file_id)+'" alt="'+h.esc(p.title)+'">':'<div class="placeholder">'+icon(p.category)+'</div>';a.innerHTML='<div class="preview">'+pv+'<span class="kind">'+h.esc(h.cat(p.category))+'</span></div><div class="body"><h2>'+h.esc(p.title)+'</h2><p>by '+h.esc(p.display_name||p.username||"Unknown")+'</p><p class="meta">↓ '+Number(p.download_count||0)+' ・ '+h.esc(h.formatDate(p.created_at).split(" ")[0])+'</p></div>';a.onclick=()=>h.openPost(p.id,{onDelete:loadAll});grid.appendChild(a)});status.textContent=items.length+'件中 '+(shown.length?((page-1)*PER+1):0)+'〜'+Math.min(page*PER,items.length)+'件を表示';pageLabel.textContent=page+' / '+pages;prev.disabled=page<=1;next.disabled=page>=pages;const u=new URL(location.href);if(category)u.searchParams.set("category",category);else u.searchParams.delete("category");if(q.value.trim())u.searchParams.set("q",q.value.trim());else u.searchParams.delete("q");u.searchParams.set("sort",sort.value);u.searchParams.set("page",page);history.replaceState(null,"",u)}
  async function loadAll(){status.textContent="作品を読み込み中...";try{let out=[],offset=0;for(let guard=0;guard<100;guard++){const r=await fetch(API+'/posts?limit=50&offset='+offset),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||"作品を取得できませんでした");const batch=d.posts||[];out.push(...batch);if(batch.length<50)break;offset+=50}all=out;render()}catch(e){status.textContent="読み込みに失敗しました。";grid.innerHTML='<div class="empty">'+helper().esc(e.message)+'</div>'}}
  const params=new URLSearchParams(location.search);category=params.get("category")||"";q.value=params.get("q")||"";sort.value=params.get("sort")||"new";page=Math.max(1,Number(params.get("page")||1));document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.category===category);b.onclick=()=>{category=b.dataset.category||"";page=1;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render()}});q.oninput=()=>{page=1;render()};sort.onchange=()=>{page=1;render()};prev.onclick=()=>{page--;render();scrollTo({top:0,behavior:"smooth"})};next.onclick=()=>{page++;render();scrollTo({top:0,behavior:"smooth"})};document.getElementById("modalClose").onclick=()=>helper().closePost();document.getElementById("postModal").onclick=e=>{if(e.target.id==="postModal")helper().closePost()};document.addEventListener("keydown",e=>{if(e.key==="Escape")helper().closePost()});loadAll().then(()=>{const id=params.get("post");if(id)helper().openPost(id,{onDelete:loadAll})});
})();
</script>
</body>
</html>
