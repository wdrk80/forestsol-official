<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>マイページ | Forestsol</title><meta name="robots" content="noindex"><link rel="stylesheet" href="assets/account.css"><script src="assets/forest-auth.js" defer></script><script src="assets/page-transition.js" defer></script></head>
<body>
<header class="account-head"><div class="kicker">MY FORESTSOL</div><h1>マイページ</h1><p>プロフィールと自分の作品をここで管理できます。</p></header>
<nav><a href="index.html">メンバー紹介</a><a href="forestcraft.html">Forest Craft Studio</a><a href="forestcraft-web/">Web版</a><a class="account-current" href="mypage.html">マイページ</a></nav>
<main>
<section class="panel"><div id="profileView" class="profile-card"><div class="avatar">🐾</div><div><div class="profile-name">読み込み中…</div><div class="profile-user"></div></div></div><div class="row" style="margin-top:18px"><a id="publicProfileLink" class="button secondary" href="profile.html">公開プロフィールを見る</a><a class="button primary" href="forestcraft-web/">Forest Craft Studioを開く</a><button id="logoutBtn" class="danger" type="button">ログアウト</button></div></section>
<div class="grid" style="margin-top:18px">
<section class="panel"><h2>プロフィール編集</h2><form id="profileForm" class="form"><label class="field"><span>表示名</span><input id="displayName" maxlength="40"></label><label class="field"><span>自己紹介</span><textarea id="bio" maxlength="500" placeholder="500文字まで"></textarea></label><label class="field"><span>アイコン画像URL</span><input id="avatarUrl" type="url" maxlength="500" placeholder="https://..."></label><button class="primary" type="submit">プロフィールを保存</button></form><div id="profileStatus" class="status"></div></section>
<section class="panel"><h2>アカウント</h2><div class="notice">投稿はこのログイン中アカウントに自動で紐づきます。UPLOAD_SECRETやユーザーIDを入力する必要はありません。</div><div class="stats" id="accountStats"></div></section>
</div>
<section class="panel" style="margin-top:18px"><div class="split"><div><h2 style="margin-bottom:4px">自分の作品</h2><p style="margin:0">公開、非公開、下書きをまとめて管理。</p></div><button id="reloadBtn" class="secondary">再読み込み</button></div><div id="works" class="works" style="margin-top:20px"><div class="empty">作品を読み込み中…</div></div></section>
</main>
<script>
window.addEventListener('DOMContentLoaded',async()=>{
 const $=s=>document.querySelector(s),status=(msg,kind='')=>{const e=$('#profileStatus');e.textContent=msg;e.className='status '+kind};
 let user=await ForestAuth.me(true);if(!user){location.replace('account.html?next=mypage.html');return}
 function renderUser(){const av=user.avatar_url?`<img src="${esc(user.avatar_url)}" alt="">`:'🐾';$('#profileView').innerHTML=`<div class="avatar">${av}</div><div><div class="profile-name">${esc(user.display_name||user.username)}</div><div class="profile-user">@${esc(user.username)}</div><div class="small">${esc(user.bio||'自己紹介はまだありません。')}</div></div>`;$('#displayName').value=user.display_name||'';$('#bio').value=user.bio||'';$('#avatarUrl').value=user.avatar_url||'';$('#publicProfileLink').href='profile.html?u='+encodeURIComponent(user.username)}
 function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function preview(p){return p.preview_file_id&&p.visibility==='public'&&p.status==='published'?`<img src="${ForestAuth.API_BASE}/files/${encodeURIComponent(p.preview_file_id)}" alt="${esc(p.title)}">`:'<span style="font-size:42px">🎨</span>'}
 function renderPosts(posts){$('#accountStats').innerHTML=`<span class="stat">作品 ${posts.length}</span><span class="stat">公開 ${posts.filter(p=>p.visibility==='public'&&p.status==='published').length}</span><span class="stat">非公開 ${posts.filter(p=>p.visibility!=='public').length}</span><span class="stat">下書き ${posts.filter(p=>p.status!=='published').length}</span>`;if(!posts.length){$('#works').innerHTML='<div class="empty">まだ作品がありません。Forest Craft Studioから最初の作品を投稿できます。</div>';return}$('#works').innerHTML=posts.map(p=>`<article class="work-card" data-id="${esc(p.id)}"><div class="work-preview">${preview(p)}</div><div class="work-body"><div class="work-title">${esc(p.title)}</div><div class="work-meta">${esc(p.category)} ・ ${esc(p.visibility)} ・ ${esc(p.status)}</div><div class="work-actions"><button class="secondary visBtn" data-vis="${p.visibility==='public'?'private':'public'}">${p.visibility==='public'?'非公開へ':'公開へ'}</button><button class="secondary statusBtn" data-status="${p.status==='published'?'draft':'published'}">${p.status==='published'?'下書きへ':'公開状態へ'}</button><button class="danger delBtn">削除</button></div></div></article>`).join('');document.querySelectorAll('.visBtn').forEach(b=>b.onclick=()=>changePost(b.closest('.work-card').dataset.id,{visibility:b.dataset.vis}));document.querySelectorAll('.statusBtn').forEach(b=>b.onclick=()=>changePost(b.closest('.work-card').dataset.id,{status:b.dataset.status}));document.querySelectorAll('.delBtn').forEach(b=>b.onclick=()=>removePost(b.closest('.work-card').dataset.id))}
 async function loadPosts(){try{renderPosts(await ForestAuth.myPosts())}catch(err){$('#works').innerHTML=`<div class="empty">${esc(err.message)}</div>`}}
 async function changePost(id,values){try{await ForestAuth.updatePost(id,values);await loadPosts()}catch(err){alert(err.message)}}
 async function removePost(id){if(!confirm('この作品を削除しますか？ R2上の作品ファイルも削除されます。'))return;try{await ForestAuth.deletePost(id);await loadPosts()}catch(err){alert(err.message)}}
 renderUser();await loadPosts();
 $('#reloadBtn').onclick=loadPosts;$('#logoutBtn').onclick=async()=>{await ForestAuth.logout();location.href='account.html'};
 $('#profileForm').addEventListener('submit',async e=>{e.preventDefault();e.submitter.disabled=true;status('保存中…');try{user=await ForestAuth.updateMe({display_name:$('#displayName').value.trim(),bio:$('#bio').value.trim(),avatar_url:$('#avatarUrl').value.trim()});renderUser();status('保存しました。','good')}catch(err){status(err.message,'bad')}finally{e.submitter.disabled=false}});
});
</script></body></html>
