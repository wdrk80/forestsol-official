<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>マイページ | Forest Sol</title>
<meta name="robots" content="noindex">

<script src="assets/forest-auth.js" defer></script>
<script src="assets/page-transition.js" defer></script>

<style>
:root{
  --wood-dark:#321b0c;
  --wood:#5d381c;
  --wood-light:#81572e;
  --paper:#f4dfb8;
  --paper-light:#fff1d1;
  --ink:#432813;
  --ink-soft:#785b3f;
  --green:#536f31;
  --green-dark:#395020;
  --gold:#c99e52;
  --danger:#8e3f2e;
  --shadow:rgba(25,13,6,.45);
}

*{box-sizing:border-box}

html{
  min-height:100%;
  background:#1b1109;
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",Georgia,serif;
  background:
    linear-gradient(rgba(25,13,6,.10),rgba(25,13,6,.33)),
    url("images/backgrounds/mypage-home-interior.png") center top/cover fixed no-repeat;
}

/* =========================================================
   決定済みマイページヘッダー
   元画像そのものは加工しない。
   画像の下にある暗い余白部分はヘッダー表示領域の外に置く。
   ========================================================= */

.mypage-hero{
  position:relative;
  width:100%;
  aspect-ratio:1536 / 650;
  min-height:330px;
  overflow:hidden;
  background:
    url("images/headers/mypage-header-base.png")
    center top / 100% auto no-repeat;
  box-shadow:0 14px 38px rgba(0,0,0,.42);
}

/* 画像内の固定ユーザー表示の上に、実アカウント情報を載せる */
.hero-user{
  position:absolute;
  z-index:4;
  top:18.4%;
  right:1.9%;
  width:28.2%;
  min-height:108px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:13px 18px;
  border:2px solid rgba(210,159,81,.50);
  border-radius:13px;
  color:#f7e8c4;
  background:
    linear-gradient(180deg,rgba(103,66,32,.99),rgba(61,34,16,.99));
  box-shadow:
    inset 0 1px 0 rgba(255,235,192,.20),
    0 8px 20px rgba(0,0,0,.28);
}

.hero-avatar{
  width:70px;
  height:70px;
  flex:0 0 70px;
  overflow:hidden;
  display:grid;
  place-items:center;
  border-radius:50%;
  border:3px solid #d8b16c;
  color:#2b1b10;
  background:#efe0bc;
  font-size:32px;
}

.hero-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.hero-user strong{
  display:block;
  font-size:clamp(13px,1.45vw,23px);
  line-height:1.25;
}

.hero-user small{
  display:block;
  margin-top:5px;
  color:#e1c99c;
  font-size:clamp(10px,.9vw,14px);
}

/* 承認済み木製ボタン */
.hero-button-nav{
  position:absolute;
  z-index:8;
  left:0;
  right:0;
  bottom:8px;
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  align-items:end;
  gap:8px;
  padding:0 12px;
}

.hero-button-nav a{
  display:block;
  min-width:0;
  text-decoration:none;
  transition:transform .14s ease, filter .14s ease;
  filter:drop-shadow(0 7px 8px rgba(0,0,0,.34));
}

.hero-button-nav a:hover{
  transform:translateY(-4px);
  filter:brightness(1.06) drop-shadow(0 10px 10px rgba(0,0,0,.42));
}

.hero-button-nav a:active{
  transform:translateY(1px);
}

.hero-button-nav a:focus-visible{
  outline:3px solid #ffe093;
  outline-offset:2px;
  border-radius:14px;
}

.hero-button-nav img{
  display:block;
  width:100%;
  height:auto;
  object-fit:contain;
}

/* =========================================================
   本体
   ========================================================= */

.page-wrap{
  width:min(1320px,calc(100% - 32px));
  margin:0 auto;
  padding:34px 0 70px;
}

.dashboard{
  display:grid;
  grid-template-columns:280px minmax(0,1fr) 300px;
  gap:20px;
  align-items:start;
}

.wood-card,
.paper-card{
  position:relative;
  overflow:hidden;
  border-radius:17px;
  box-shadow:0 18px 46px var(--shadow);
}

.wood-card{
  border:2px solid rgba(218,170,94,.24);
  color:#f5e4bd;
  background:
    linear-gradient(180deg,rgba(77,44,20,.96),rgba(44,24,11,.98));
}

.paper-card{
  border:2px solid rgba(91,57,27,.25);
  background:
    linear-gradient(180deg,rgba(255,244,219,.97),rgba(235,208,161,.97));
}

.paper-card::before{
  content:"";
  position:absolute;
  inset:9px;
  border:1px solid rgba(96,62,30,.13);
  border-radius:11px;
  pointer-events:none;
}

/* 左はプロフィールカードだけ。重複メニューは置かない */
.profile-card{
  padding:20px 17px 18px;
  text-align:center;
}

.profile-card h1{
  margin:0 0 18px;
  padding:10px;
  border-radius:10px;
  color:#f8e7ba;
  background:linear-gradient(180deg,#704720,#482711);
  font-size:19px;
}

.avatar-large{
  width:138px;
  height:138px;
  margin:0 auto 13px;
  overflow:hidden;
  display:grid;
  place-items:center;
  border-radius:50%;
  border:5px solid #d2aa60;
  outline:3px solid rgba(59,31,13,.78);
  background:#ead9b8;
  font-size:54px;
}

.avatar-large img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-size:22px;
  font-weight:900;
}

.profile-user{
  margin-top:4px;
  color:#cdb990;
  font-size:12px;
}

.profile-bio{
  margin:14px 0 17px;
  color:#ddccaa;
  font-size:12px;
  line-height:1.75;
}

.profile-buttons{
  display:grid;
  gap:9px;
}

.button{
  min-height:43px;
  display:grid;
  place-items:center;
  padding:8px 12px;
  border-radius:9px;
  text-decoration:none;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}

.button.green{
  color:#fff3d2;
  border:1px solid #46622b;
  background:linear-gradient(180deg,#718d48,#4f692f);
}

.button.wood{
  color:#f8e5bd;
  border:1px solid #8f6335;
  background:linear-gradient(180deg,#714821,#4c2b13);
}

/* 中央 */
.center{
  display:grid;
  gap:18px;
}

.welcome{
  padding:24px 26px;
}

.welcome h2,
.section-title{
  position:relative;
  z-index:1;
}

.welcome h2{
  margin:0 0 8px;
  font-size:27px;
}

.welcome p{
  position:relative;
  z-index:1;
  margin:0;
  color:var(--ink-soft);
  line-height:1.8;
}

.notice-card,
.works-card{
  padding:20px 22px 22px;
}

.section-head{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}

.section-head h2{
  margin:0;
  font-size:21px;
}

.section-head button{
  border:0;
  color:#62462e;
  background:transparent;
  font:inherit;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}

/* notice-board は「掲示板の透かし」としてのみ使う */
.notice-card::after{
  content:"";
  position:absolute;
  right:-16px;
  bottom:-25px;
  width:170px;
  height:170px;
  background:url("images/ui/notice-board.png") center/contain no-repeat;
  opacity:.10;
  pointer-events:none;
}

.notice-list{
  position:relative;
  z-index:1;
  display:grid;
  gap:8px;
}

.notice-row{
  display:grid;
  grid-template-columns:90px 1fr;
  gap:12px;
  padding:11px 13px;
  border-radius:9px;
  background:rgba(255,252,240,.48);
}

.notice-row b{
  color:#806348;
  font-size:11px;
}

.notice-row span{
  font-size:12px;
  font-weight:700;
}

.works{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.work-card{
  overflow:hidden;
  border:1px solid rgba(84,52,25,.24);
  border-radius:12px;
  background:rgba(255,249,232,.76);
}

.work-preview{
  height:165px;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:rgba(103,132,70,.10);
}

.work-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.work-body{
  padding:12px;
}

.work-title{
  margin-bottom:5px;
  font-size:14px;
  font-weight:900;
}

.work-meta{
  color:#80634a;
  font-size:10px;
}

.work-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}

.mini-btn{
  min-height:30px;
  padding:0 9px;
  border:1px solid #89613a;
  border-radius:7px;
  color:#54351e;
  background:#e9cea0;
  font:inherit;
  font-size:10px;
  font-weight:900;
  cursor:pointer;
}

.mini-btn.delete{
  color:#fff0e5;
  border-color:#713122;
  background:#904630;
}

.empty{
  grid-column:1/-1;
  padding:30px 20px;
  border:1px dashed rgba(89,58,28,.28);
  border-radius:10px;
  text-align:center;
  color:#775c43;
}

/* 右は必要な情報だけ */
.right{
  display:grid;
  gap:16px;
}

.stats-card,
.edit-card{
  padding:19px;
}

.stats-card h2{
  position:relative;
  z-index:1;
  margin:0 0 14px;
  font-size:20px;
}

.stats-grid{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.stat{
  padding:13px 8px;
  border:1px solid rgba(87,56,28,.17);
  border-radius:10px;
  text-align:center;
  background:rgba(255,250,235,.46);
}

.stat strong{
  display:block;
  font-size:23px;
}

.stat span{
  color:#80644a;
  font-size:10px;
}

.edit-card details{
  position:relative;
  z-index:1;
}

.edit-card summary{
  cursor:pointer;
  font-size:16px;
  font-weight:900;
}

.form{
  display:grid;
  gap:12px;
  margin-top:16px;
}

.field{
  display:grid;
  gap:6px;
}

.field span{
  font-size:11px;
  font-weight:900;
}

.field input,
.field textarea{
  width:100%;
  padding:10px 11px;
  border:1px solid rgba(84,53,27,.24);
  border-radius:8px;
  color:var(--ink);
  background:rgba(255,253,245,.78);
  font:inherit;
  font-size:12px;
}

.field textarea{
  min-height:95px;
  resize:vertical;
}

.save-btn{
  min-height:42px;
  border:1px solid #48632c;
  border-radius:9px;
  color:#fff3d0;
  background:linear-gradient(180deg,#718d48,#506b30);
  font:inherit;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}

.status{
  min-height:18px;
  margin-top:10px;
  text-align:center;
  font-size:11px;
  font-weight:900;
}

.status.good{color:#47692d}
.status.bad{color:#983e30}

/* レスポンシブ */
@media(max-width:1080px){
  .dashboard{
    grid-template-columns:260px minmax(0,1fr);
  }

  .right{
    grid-column:1/-1;
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:760px){
  body{background-attachment:scroll}

  .hero-button-nav{
    display:flex;
    overflow-x:auto;
    gap:5px;
    padding:0 8px 5px;
    scrollbar-width:none;
  }

  .hero-button-nav::-webkit-scrollbar{display:none}

  .hero-button-nav a{
    flex:0 0 190px;
  }


  .mypage-hero{
    min-height:0;
  }

  .hero-user{
    top:15%;
    right:2%;
    width:36%;
    min-height:0;
    padding:8px 10px;
  }

  .hero-avatar{
    width:44px;
    height:44px;
    flex-basis:44px;
    border-width:2px;
  }

  .hero-user small{
    display:none;
  }

  .dashboard{
    grid-template-columns:1fr;
  }

  .right{
    grid-column:auto;
    grid-template-columns:1fr;
  }

  .works{
    grid-template-columns:1fr;
  }
}

@media(max-width:500px){
  .page-wrap{
    width:calc(100% - 18px);
    padding-top:18px;
  }

  .hero-user{
    display:none;
  }

  .profile-card{
    padding:17px 14px;
  }
}
</style>
</head>

<body>

<header class="mypage-hero" aria-label="Forest Sol マイページ">
  <div class="hero-user">
    <div id="headerAvatar" class="hero-avatar">🐾</div>
    <div>
      <strong id="headerGreeting">こんにちは！</strong>
      <small id="headerUser">@user</small>
    </div>
  </div>

  <nav class="hero-button-nav" aria-label="マイページメニュー">
    <a href="index.html" aria-label="ホーム">
      <img src="images/buttons/mypage/home.png" alt="ホーム">
    </a>
    <a id="headerProfileLink" href="profile.html" aria-label="プロフィール">
      <img src="images/buttons/mypage/profile.png" alt="プロフィール">
    </a>
    <a href="#myWorks" aria-label="プレイ履歴">
      <img src="images/buttons/mypage/play-history.png" alt="プレイ履歴">
    </a>
    <a href="index.html#community" aria-label="フレンド">
      <img src="images/buttons/mypage/friends.png" alt="フレンド">
    </a>
    <a href="#notices" aria-label="お知らせ">
      <img src="images/buttons/mypage/notices.png" alt="お知らせ">
    </a>
    <a href="#profileEdit" aria-label="設定">
      <img src="images/buttons/mypage/settings.png" alt="設定">
    </a>
  </nav>
</header>

<main class="page-wrap">
  <div class="dashboard">

    <aside>
      <section class="wood-card profile-card">
        <h1>マイページ</h1>

        <div id="profileView">
          <div class="avatar-large">🐾</div>
          <div class="profile-name">読み込み中…</div>
          <div class="profile-user"></div>
        </div>

        <div class="profile-buttons">
          <a id="publicProfileLink" class="button wood" href="profile.html">
            公開プロフィールを見る
          </a>

          <a class="button green" href="forestcraft-web/">
            Forest Craft Studioを開く
          </a>
        </div>
      </section>
    </aside>

    <section class="center">

      <section class="paper-card welcome">
        <h2 id="welcomeTitle">ようこそ。</h2>
        <p>
          ここはあなたの森の家。
          プロフィールや作品を管理しながら、Forest Solでの活動を育てていけます。
        </p>
      </section>

      <section id="notices" class="paper-card notice-card">
        <div class="section-head">
          <h2>お知らせ</h2>
        </div>

        <div class="notice-list">
          <div class="notice-row">
            <b>STUDIO</b>
            <span>作品はForest Craft Studioから投稿すると、このページに自動で表示されます。</span>
          </div>

          <div class="notice-row">
            <b>PROFILE</b>
            <span>表示名、自己紹介、アイコンは右側の「プロフィール編集」から変更できます。</span>
          </div>
        </div>
      </section>

      <section id="myWorks" class="paper-card works-card">
        <div class="section-head">
          <h2>自分の作品</h2>
          <button id="reloadBtn" type="button">再読み込み</button>
        </div>

        <div id="works" class="works">
          <div class="empty">作品を読み込み中…</div>
        </div>
      </section>

    </section>

    <aside class="right">

      <section class="paper-card stats-card">
        <h2>アカウント状況</h2>
        <div id="accountStats" class="stats-grid">
          <div class="stat">
            <strong>…</strong>
            <span>作品</span>
          </div>
        </div>
      </section>

      <section id="profileEdit" class="paper-card edit-card">
        <details>
          <summary>プロフィール編集</summary>

          <form id="profileForm" class="form">
            <label class="field">
              <span>表示名</span>
              <input id="displayName" maxlength="40">
            </label>

            <label class="field">
              <span>自己紹介</span>
              <textarea id="bio" maxlength="500" placeholder="500文字まで"></textarea>
            </label>

            <label class="field">
              <span>アイコン画像URL</span>
              <input id="avatarUrl" type="url" maxlength="500" placeholder="https://...">
            </label>

            <button class="save-btn" type="submit">プロフィールを保存</button>
          </form>

          <div id="profileStatus" class="status"></div>
        </details>
      </section>

    </aside>

  </div>
</main>

<script>
window.addEventListener("DOMContentLoaded", async () => {
  const $ = selector => document.querySelector(selector);

  const esc = value =>
    String(value ?? "").replace(/[&<>"']/g, char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    })[char]);

  const setStatus = (message, kind = "") => {
    const el = $("#profileStatus");
    el.textContent = message;
    el.className = "status " + kind;
  };

  let user = await ForestAuth.me(true);

  if (!user) {
    location.replace("account.html?next=mypage.html");
    return;
  }

  function avatarMarkup() {
    if (user.avatar_url) {
      return `<img src="${esc(user.avatar_url)}" alt="">`;
    }
    return "🐾";
  }

  function renderUser() {
    const name = user.display_name || user.username;

    $("#profileView").innerHTML = `
      <div class="avatar-large">${avatarMarkup()}</div>
      <div class="profile-name">${esc(name)}</div>
      <div class="profile-user">@${esc(user.username)}</div>
      <div class="profile-bio">${esc(user.bio || "自己紹介はまだありません。")}</div>
    `;

    $("#headerAvatar").innerHTML = avatarMarkup();
    $("#headerGreeting").textContent = `こんにちは、${name}さん！`;
    $("#headerUser").textContent = `@${user.username}`;
    $("#welcomeTitle").textContent = `ようこそ、${name}さん。`;

    $("#displayName").value = user.display_name || "";
    $("#bio").value = user.bio || "";
    $("#avatarUrl").value = user.avatar_url || "";

    const profileUrl =
      "profile.html?u=" + encodeURIComponent(user.username);

    $("#publicProfileLink").href = profileUrl;
    $("#headerProfileLink").href = profileUrl;
  }

  function preview(post) {
    if (
      post.preview_file_id &&
      post.visibility === "public" &&
      post.status === "published"
    ) {
      return `
        <img
          src="${ForestAuth.API_BASE}/files/${encodeURIComponent(post.preview_file_id)}"
          alt="${esc(post.title)}"
        >
      `;
    }

    /* 既存素材は「作品の代替プレビュー」が必要な時だけ使用 */
    return `
      <img
        src="images/collections/animal-and-monster-set-01.png"
        alt=""
      >
    `;
  }

  function renderStats(posts) {
    const publicCount =
      posts.filter(p =>
        p.visibility === "public" &&
        p.status === "published"
      ).length;

    const privateCount =
      posts.filter(p => p.visibility !== "public").length;

    const draftCount =
      posts.filter(p => p.status !== "published").length;

    $("#accountStats").innerHTML = `
      <div class="stat">
        <strong>${posts.length}</strong>
        <span>作品</span>
      </div>

      <div class="stat">
        <strong>${publicCount}</strong>
        <span>公開</span>
      </div>

      <div class="stat">
        <strong>${privateCount}</strong>
        <span>非公開</span>
      </div>

      <div class="stat">
        <strong>${draftCount}</strong>
        <span>下書き</span>
      </div>
    `;
  }

  function renderPosts(posts) {
    renderStats(posts);

    if (!posts.length) {
      $("#works").innerHTML = `
        <div class="empty">
          まだ作品がありません。Forest Craft Studioから最初の作品を投稿できます。
        </div>
      `;
      return;
    }

    $("#works").innerHTML = posts.map(post => `
      <article class="work-card" data-id="${esc(post.id)}">
        <div class="work-preview">${preview(post)}</div>

        <div class="work-body">
          <div class="work-title">${esc(post.title)}</div>

          <div class="work-meta">
            ${esc(post.category)} ・
            ${esc(post.visibility)} ・
            ${esc(post.status)}
          </div>

          <div class="work-actions">
            <button
              class="mini-btn visBtn"
              data-vis="${post.visibility === "public" ? "private" : "public"}"
              type="button"
            >
              ${post.visibility === "public" ? "非公開へ" : "公開へ"}
            </button>

            <button
              class="mini-btn statusBtn"
              data-status="${post.status === "published" ? "draft" : "published"}"
              type="button"
            >
              ${post.status === "published" ? "下書きへ" : "公開状態へ"}
            </button>

            <button class="mini-btn delete delBtn" type="button">
              削除
            </button>
          </div>
        </div>
      </article>
    `).join("");

    document.querySelectorAll(".visBtn").forEach(button => {
      button.onclick = () =>
        changePost(
          button.closest(".work-card").dataset.id,
          { visibility: button.dataset.vis }
        );
    });

    document.querySelectorAll(".statusBtn").forEach(button => {
      button.onclick = () =>
        changePost(
          button.closest(".work-card").dataset.id,
          { status: button.dataset.status }
        );
    });

    document.querySelectorAll(".delBtn").forEach(button => {
      button.onclick = () =>
        removePost(button.closest(".work-card").dataset.id);
    });
  }

  async function loadPosts() {
    try {
      renderPosts(await ForestAuth.myPosts());
    } catch (error) {
      $("#works").innerHTML = `
        <div class="empty">${esc(error.message)}</div>
      `;
    }
  }

  async function changePost(id, values) {
    try {
      await ForestAuth.updatePost(id, values);
      await loadPosts();
    } catch (error) {
      alert(error.message);
    }
  }

  async function removePost(id) {
    if (!confirm("この作品を削除しますか？ R2上の作品ファイルも削除されます。")) {
      return;
    }

    try {
      await ForestAuth.deletePost(id);
      await loadPosts();
    } catch (error) {
      alert(error.message);
    }
  }

  renderUser();
  await loadPosts();

  $("#reloadBtn").onclick = loadPosts;

  $("#profileForm").addEventListener("submit", async event => {
    event.preventDefault();

    event.submitter.disabled = true;
    setStatus("保存中…");

    try {
      user = await ForestAuth.updateMe({
        display_name: $("#displayName").value.trim(),
        bio: $("#bio").value.trim(),
        avatar_url: $("#avatarUrl").value.trim()
      });

      renderUser();
      setStatus("保存しました。","good");
    } catch (error) {
      setStatus(error.message,"bad");
    } finally {
      event.submitter.disabled = false;
    }
  });
});
</script>

</body>
</html>
