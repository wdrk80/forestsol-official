<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>プロフィール | Forestsol</title><link rel="stylesheet" href="assets/account.css"><script src="assets/forest-auth.js" defer></script><script src="assets/page-transition.js" defer></script></head>
<body>
<header class="account-head"><div class="kicker">FORESTSOL CREATOR</div><h1>クリエイタープロフィール</h1><p>Forest Craft Studioで公開された作品をまとめて表示します。</p></header>
<nav><a href="index.html">メンバー紹介</a><a href="forestcraft.html">Forest Craft Studio</a><a href="forestcraft-web/">Web版</a></nav>
<main><section class="panel"><div id="profileView" class="profile-card"><div class="avatar">🐾</div><div><div class="profile-name">読み込み中…</div></div></div></section><section class="panel" style="margin-top:18px"><h2>公開作品</h2><div id="works" class="works"><div class="empty">読み込み中…</div></div></section></main>
<script>
window.addEventListener('DOMContentLoaded',async()=>{const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const username=new URLSearchParams(location.search).get('u');if(!username){$('#profileView').innerHTML='<div class="empty">ユーザーが指定されていません。</div>';$('#works').innerHTML='';return}try{const [u,posts]=await Promise.all([ForestAuth.publicUser(username),ForestAuth.publicPosts(username)]);document.title=`${u.display_name||u.username} | Forestsol`;$('#profileView').innerHTML=`<div class="avatar">${u.avatar_url?`<img src="${esc(u.avatar_url)}" alt="">`:'🐾'}</div><div><div class="profile-name">${esc(u.display_name||u.username)}</div><div class="profile-user">@${esc(u.username)}</div><p>${esc(u.bio||'自己紹介はまだありません。')}</p><div class="stats"><span class="stat">公開作品 ${posts.length}</span></div></div>`;if(!posts.length){$('#works').innerHTML='<div class="empty">公開作品はまだありません。</div>';return}$('#works').innerHTML=posts.map(p=>`<article class="work-card"><div class="work-preview">${p.preview_file_id?`<img src="${ForestAuth.API_BASE}/files/${encodeURIComponent(p.preview_file_id)}" alt="${esc(p.title)}">`:'🎨'}</div><div class="work-body"><div class="work-title">${esc(p.title)}</div><div class="work-meta">${esc(p.category)} ・ ★ ${Number(p.rating_average||0).toFixed(1)} ・ ↓ ${Number(p.download_count||0)}</div><div class="work-actions"><a class="button secondary" href="forestcraft.html#gallery">ギャラリーで見る</a></div></div></article>`).join('')}catch(err){$('#profileView').innerHTML=`<div class="empty">${esc(err.message)}</div>`;$('#works').innerHTML=''}});
</script></body></html>
