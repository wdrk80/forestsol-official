<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>プロフィール | Forest Sol</title>
<meta name="robots" content="noindex">
<script src="assets/forest-auth.js" defer></script>
<script src="assets/page-transition.js" defer></script>
<style>
:root{
  --ink:#3b2918;
  --paper:#f4e2bd;
  --paper2:#fff3d4;
  --wood:#4e3018;
  --wood2:#2d1a0e;
  --teal:#0c5c5b;
  --teal2:#073f42;
  --gold:#d4ab61;
  --shadow:rgba(17,12,7,.42);
}
*{box-sizing:border-box}
html{min-height:100%;background:#102822;scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",Georgia,serif;
  background:
    linear-gradient(rgba(8,29,24,.18),rgba(9,19,15,.54)),
    url("images/profile/profile-river-background.png") center top/cover fixed no-repeat;
}
.hero{
  width:100%;
  aspect-ratio:2048/704;
  min-height:220px;
  background:url("images/profile/profile-header.png") center/cover no-repeat;
  box-shadow:0 12px 34px rgba(0,0,0,.42);
}
.site-nav{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:center;
  gap:8px;
  padding:10px 12px;
  border-top:1px solid rgba(242,214,160,.24);
  border-bottom:1px solid rgba(26,11,4,.58);
  background:linear-gradient(180deg,rgba(51,31,15,.96),rgba(34,19,10,.96));
  box-shadow:0 8px 20px rgba(0,0,0,.28);
  backdrop-filter:blur(8px);
}
.site-nav a{
  min-width:112px;
  padding:10px 15px;
  border:1px solid rgba(222,174,91,.22);
  border-radius:999px;
  color:#f7e7bf;
  text-decoration:none;
  text-align:center;
  font-size:13px;
  font-weight:900;
  background:linear-gradient(180deg,rgba(105,68,32,.72),rgba(57,33,16,.72));
  box-shadow:inset 0 1px 0 rgba(255,240,200,.11);
  transition:.16s ease;
}
.site-nav a:hover{transform:translateY(-2px);filter:brightness(1.08)}
.site-nav a.current{background:linear-gradient(180deg,#1d7773,#0d4e4d);border-color:#4fa8a1}
.page{
  width:min(1220px,calc(100% - 28px));
  margin:0 auto;
  padding:32px 0 72px;
}
.guild-wrap{position:relative;margin-bottom:28px}
.guild-card{
  position:relative;
  width:100%;
  aspect-ratio:2048/704;
  min-height:250px;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.42));
}
.guild-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  pointer-events:none;
  user-select:none;
}
.guild-avatar{
  position:absolute;
  left:4.4%;
  top:10.8%;
  width:23.5%;
  aspect-ratio:1;
  overflow:hidden;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:#275250;
  background:radial-gradient(circle at 45% 35%,#fff5da,#ead5aa 72%,#cfa96c);
  font-size:clamp(24px,6vw,76px);
  box-shadow:inset 0 0 0 4px rgba(92,55,25,.12);
}
.guild-avatar img{width:100%;height:100%;object-fit:cover}
.guild-name{
  position:absolute;
  left:33.5%;
  top:20.5%;
  width:34%;
  overflow:hidden;
  color:#f6ead1;
  text-shadow:0 3px 4px rgba(0,0,0,.72);
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:clamp(16px,3vw,44px);
  font-weight:900;
  letter-spacing:.04em;
}
.guild-user{
  position:absolute;
  left:35.5%;
  top:47.6%;
  width:28%;
  color:#e5d5b7;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:clamp(9px,1.4vw,20px);
  font-weight:800;
}
.guild-bio{
  position:absolute;
  left:33.2%;
  top:61.8%;
  width:31%;
  height:16.5%;
  margin:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  color:#5f4329;
  line-height:1.45;
  font-size:clamp(8px,1.25vw,18px);
  font-weight:700;
}
.guild-crest{
  position:absolute;
  right:12.2%;
  top:18%;
  width:11%;
  aspect-ratio:1;
  display:grid;
  place-items:center;
  color:#d9fff7;
  font-size:clamp(20px,4.2vw,62px);
  text-shadow:0 4px 10px rgba(0,0,0,.45);
  opacity:.9;
}
.guild-stat{
  position:absolute;
  right:12.2%;
  top:59.4%;
  width:15.2%;
  height:19%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#f4e7c7;
  text-shadow:0 2px 4px rgba(0,0,0,.65);
}
.guild-stat span{font-size:clamp(7px,1vw,14px);font-weight:800}
.guild-stat strong{margin-top:2px;font-size:clamp(15px,2.6vw,38px);line-height:1}
.section{
  position:relative;
  overflow:hidden;
  border:2px solid rgba(91,59,31,.28);
  border-radius:20px;
  background:linear-gradient(180deg,rgba(255,245,219,.96),rgba(233,211,171,.96));
  box-shadow:0 18px 42px var(--shadow);
}
.section::before{
  content:"";
  position:absolute;
  inset:10px;
  border:1px solid rgba(89,55,27,.14);
  border-radius:13px;
  pointer-events:none;
}
.works-section{padding:24px 24px 28px}
.works-section::after{
  content:"";
  position:absolute;
  right:-54px;
  top:-48px;
  width:210px;
  height:210px;
  background:url("images/ui/notice-board.png") center/contain no-repeat;
  opacity:.075;
  pointer-events:none;
}
.section-head{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:18px;
}
.section-title{margin:0;color:#4a2d16;font-size:25px}
.section-sub{color:#87684a;font-size:11px}
.works{
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}
.work-card{
  overflow:hidden;
  border:1px solid rgba(79,50,24,.24);
  border-radius:15px;
  background:rgba(255,250,235,.76);
  box-shadow:0 8px 22px rgba(84,50,24,.12);
  transition:.16s ease;
}
.work-card:hover{transform:translateY(-3px);box-shadow:0 13px 26px rgba(84,50,24,.18)}
.work-preview{
  height:190px;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,rgba(59,125,113,.16),rgba(190,154,85,.12));
}
.work-preview img{width:100%;height:100%;object-fit:cover}
.work-body{padding:14px}
.work-title{color:#412915;font-size:16px;font-weight:900}
.work-meta{margin-top:6px;color:#806248;font-size:11px;line-height:1.6}
.work-actions{margin-top:12px}
.gallery-link{
  display:inline-block;
  padding:8px 12px;
  border:1px solid #7d5731;
  border-radius:9px;
  color:#fff0cf;
  text-decoration:none;
  font-size:11px;
  font-weight:900;
  background:linear-gradient(180deg,#73502a,#4b2c16);
}
.empty{
  grid-column:1/-1;
  min-height:210px;
  display:grid;
  place-items:center;
  padding:30px;
  border:1px dashed rgba(87,57,28,.27);
  border-radius:14px;
  text-align:center;
  color:#765b43;
  background:
    linear-gradient(rgba(255,248,230,.78),rgba(255,248,230,.78)),
    url("images/collections/animal-and-monster-set-01.png") center/cover no-repeat;
}
.empty-inner{
  max-width:500px;
  padding:18px 22px;
  border-radius:12px;
  background:rgba(255,244,218,.88);
  box-shadow:0 6px 18px rgba(76,45,23,.12);
}
.empty strong{display:block;margin-bottom:6px;color:#54351e;font-size:18px}
.footer-note{
  margin-top:24px;
  text-align:center;
  color:rgba(255,244,213,.82);
  font-size:11px;
  text-shadow:0 2px 5px rgba(0,0,0,.55);
}
@media(max-width:900px){
  .works{grid-template-columns:repeat(2,minmax(0,1fr))}
  .guild-name{left:33%;width:36%}
}
@media(max-width:680px){
  body{background-attachment:scroll}
  .hero{min-height:0}
  .site-nav{justify-content:flex-start;overflow-x:auto;padding:8px;scrollbar-width:none}
  .site-nav::-webkit-scrollbar{display:none}
  .site-nav a{flex:0 0 auto;min-width:96px;padding:8px 12px;font-size:11px}
  .page{width:calc(100% - 14px);padding-top:14px}
  .guild-card{min-height:0}
  .guild-avatar{left:4.8%;top:11%;width:23%}
  .guild-name{left:33%;top:20%;width:36%;font-size:clamp(11px,4vw,22px)}
  .guild-user{left:35%;top:47%;font-size:clamp(7px,2.3vw,12px)}
  .guild-bio{left:33%;top:61%;width:31%;font-size:clamp(6px,2vw,10px);line-height:1.25}
  .guild-crest{font-size:clamp(15px,6vw,32px)}
  .guild-stat span{font-size:clamp(5px,1.8vw,8px)}
  .guild-stat strong{font-size:clamp(11px,4vw,20px)}
  .works-section{padding:18px 14px 20px}
  .section-title{font-size:20px}
  .section-sub{display:none}
  .works{grid-template-columns:1fr}
  .work-preview{height:180px}
  .empty{min-height:180px;padding:16px}
}
</style>
</head>
<body>
<header class="hero" aria-label="プロフィール"></header>
<nav class="site-nav" aria-label="サイトメニュー">
  <a href="index.html">ホーム</a>
  <a class="current" href="#profileCard">プロフィール</a>
  <a href="forestcraft.html">Forest Craft Studio</a>
  <a href="mypage.html">マイページ</a>
</nav>
<main class="page">
  <section id="profileCard" class="guild-wrap" aria-label="プロフィールカード">
    <div class="guild-card">
      <img class="guild-frame" src="images/profile/profile-card-frame.png" alt="">
      <div id="guildAvatar" class="guild-avatar">🐾</div>
      <div id="guildName" class="guild-name">読み込み中…</div>
      <div id="guildUser" class="guild-user"></div>
      <p id="guildBio" class="guild-bio"></p>
      <div class="guild-crest" aria-hidden="true">🐾</div>
      <div class="guild-stat"><span>公開作品</span><strong id="guildCount">0</strong></div>
    </div>
  </section>

  <section class="section works-section">
    <div class="section-head">
      <h2 class="section-title">公開作品</h2>
      <span id="worksCount" class="section-sub">読み込み中…</span>
    </div>
    <div id="works" class="works">
      <div class="empty"><div class="empty-inner"><strong>作品を読み込んでいます</strong><span>少しだけお待ちください。</span></div></div>
    </div>
  </section>

  <div class="footer-note">Forest Sol Profile</div>
</main>
<script>
window.addEventListener('DOMContentLoaded',async()=>{
  const $=s=>document.querySelector(s);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const username=new URLSearchParams(location.search).get('u');

  if(!username){
    $('#guildName').textContent='ユーザー未指定';
    $('#guildBio').textContent='プロフィールを表示するユーザーが指定されていません。';
    $('#works').innerHTML='<div class="empty"><div class="empty-inner"><strong>プロフィールを表示できません</strong><span>URLを確認してください。</span></div></div>';
    $('#worksCount').textContent='';
    return;
  }

  try{
    const [u,posts]=await Promise.all([
      ForestAuth.publicUser(username),
      ForestAuth.publicPosts(username)
    ]);

    const name=u.display_name||u.username;
    document.title=`${name} | Forest Sol`;

    $('#guildName').textContent=name;
    $('#guildUser').textContent='@'+u.username;
    $('#guildBio').textContent=u.bio||'自己紹介はまだありません。';
    $('#guildCount').textContent=posts.length;
    $('#worksCount').textContent=`公開作品 ${posts.length}件`;
    $('#guildAvatar').innerHTML=u.avatar_url?`<img src="${esc(u.avatar_url)}" alt="${esc(name)}">`:'🐾';

    if(!posts.length){
      $('#works').innerHTML='<div class="empty"><div class="empty-inner"><strong>公開作品はまだありません。</strong><span>作品が公開されると、ここに並びます。</span></div></div>';
      return;
    }

    $('#works').innerHTML=posts.map(p=>{
      const preview=p.preview_file_id
        ? `<img src="${ForestAuth.API_BASE}/files/${encodeURIComponent(p.preview_file_id)}" alt="${esc(p.title)}">`
        : '<img src="images/collections/animal-and-monster-set-01.png" alt="">';
      return `<article class="work-card">
        <div class="work-preview">${preview}</div>
        <div class="work-body">
          <div class="work-title">${esc(p.title)}</div>
          <div class="work-meta">${esc(p.category)} ・ ★ ${Number(p.rating_average||0).toFixed(1)} ・ ↓ ${Number(p.download_count||0)}</div>
          <div class="work-actions"><a class="gallery-link" href="forestcraft.html#gallery">ギャラリーで見る</a></div>
        </div>
      </article>`;
    }).join('');
  }catch(err){
    $('#guildName').textContent='読み込みエラー';
    $('#guildBio').textContent=err.message;
    $('#worksCount').textContent='';
    $('#works').innerHTML=`<div class="empty"><div class="empty-inner"><strong>プロフィールを読み込めませんでした。</strong><span>${esc(err.message)}</span></div></div>`;
  }
});
</script>
</body>
</html>
